# Reverse-proxy configuration of the assessment service (research snapshot).
#
# Example: ports, certificate paths and server_name are placeholders. The limits
# below are the ones the manuscript reports (Section 7, "Admission Control at the
# Edge of the Service"): per-client request rates, 32 MB request bodies, TLS,
# HTTP/2 and response compression.

# Tarama uçları GPU'ya iş verdiği için istemci başına hız sınırı uygulanır.
limit_req_zone $binary_remote_addr zone=scan:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;

upstream service_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- HTTP: yalnızca HTTPS'e yönlendirir ---
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    return 301 https://$host:8443$request_uri;
}

# --- HTTPS ---
server {
    # `http2 on;` ayrı direktifi nginx 1.25+ ile geldi; 1.18 için listen'a eklenir.
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/service.example.crt;      # placeholder
    ssl_certificate_key /etc/ssl/private/service.example.key;    # placeholder
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SVC_SSL:10m;
    ssl_session_timeout 1h;

    # Envanter listeleri büyük olabilir.
    client_max_body_size 32m;

    access_log /var/log/nginx/service.access.log;
    error_log  /var/log/nginx/service.error.log;

    # Güvenlik başlıkları.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Self-signed sertifikada HSTS göndermeyin: tarayıcı sonradan HTTP'ye
    # dönmeyi reddeder ve sertifika değişirse erişim kilitlenir.

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # --- Yönetim API'si ---
    location /admin/ {
        limit_req zone=admin burst=10 nodelay;
        proxy_pass http://service_backend;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- Tarama ve job uçları ---
    location ~ ^/(scan|jobs) {
        limit_req zone=scan burst=50 nodelay;
        proxy_pass http://service_backend;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Senkron tarama (wait=true) model çalıştırır; varsayılan 60 sn kısa kalır.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # --- Sağlık ve dokümantasyon ---
    location ~ ^/(health|docs|redoc|openapi.json) {
        proxy_pass http://service_backend;
        include /etc/nginx/proxy_params;
    }
}
